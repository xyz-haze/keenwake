global: {scrape_interval: 5s, evaluation_interval: 5s}
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
scrape_configs:
  - job_name: fakeapp
    # fakeapp's gauges carry their own "instance" label (worker-1, ...): without this, Prometheus
    # overwrites it with the scrape target (fakeapp:9100).
    honor_labels: true
    static_configs: [{targets: ["fakeapp:9100"]}]
