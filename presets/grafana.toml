alerts = "/alerts"

[fields]
status = { path = "/status" }
identity = { path = "/fingerprint" }
summary = { first_of = ["/annotations/summary", "/labels/alertname"] }
details = { first_of = ["/annotations/description", "/annotations/message"] }
env = { first_of = ["/labels/env", "/labels/environment"] }
severity = { path = "/labels/severity" }
